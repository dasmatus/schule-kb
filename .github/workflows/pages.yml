name: Deploy vault to GitHub Pages

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '.obsidian/**'
      - 'www/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for "last updated" dates

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4 # Docusaurus itself runs on Node
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_URL: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
