<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kvíz – Cacheovanie a Monitoring DB</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#111318;--sf:#1c1f27;--cd:#242831;--br:#2e3340;--ac:#4f8ef7;--ad:rgba(79,142,247,.15);--ok:#34c87a;--od:rgba(52,200,122,.15);--er:#f05252;--ed:rgba(240,82,82,.15);--tx:#e8ecf0;--tm:#8a93a8;--r:14px;--rs:8px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 48px}
.wrap{width:100%;max-width:700px}
/* Fullscreen overlay */
#fsOverlay{display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;align-items:center;justify-content:center;text-align:center;padding:32px}
#fsOverlay.show{display:flex;flex-direction:column;animation:fu .2s ease both}
#fsOverlay h2{font-size:22px;font-weight:700;margin-bottom:8px}
#fsOverlay p{color:var(--tm);font-size:14px;margin-bottom:20px}
.btn-primary{width:100%;padding:13px;background:var(--ac);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;margin-top:8px}
.btn-primary:hover{opacity:.9}
.btn-primary:active{transform:scale(.98)}
/* Tab warning */
#tabBanner{display:none;position:fixed;top:0;left:0;right:0;background:var(--er);color:#fff;text-align:center;padding:10px 16px;font-size:14px;font-weight:600;z-index:1000;animation:fu .2s ease both}
#tabBanner.show{display:block}
/* Header */
header{text-align:center;margin-bottom:32px}
header .chip{display:inline-block;background:var(--ad);color:var(--ac);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:100px;margin-bottom:12px}
header h1{font-size:clamp(22px,5vw,32px);font-weight:700;line-height:1.25;margin-bottom:6px}
header p{color:var(--tm);font-size:14px}
/* Progress */
.progress-wrap{margin-bottom:28px}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--tm);margin-bottom:8px}
.progress-meta strong{color:var(--tx)}
.progress-bar{height:4px;background:var(--br);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--ac);border-radius:100px;transition:width .4s cubic-bezier(.4,0,.2,1)}
/* Card */
.card{background:var(--cd);border:1px solid var(--br);border-radius:var(--r);padding:28px;margin-bottom:16px;animation:fu .3s ease both}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.question-label{font-size:12px;font-weight:600;color:var(--ac);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.question-text{font-size:clamp(16px,2.5vw,18px);font-weight:600;line-height:1.5;margin-bottom:24px}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;gap:14px;background:var(--sf);border:1.5px solid var(--br);border-radius:var(--rs);padding:14px 16px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;user-select:none;-webkit-tap-highlight-color:transparent;text-align:left;width:100%;color:var(--tx);font-size:15px;line-height:1.45}
.option:hover:not(:disabled){border-color:var(--ac);background:var(--ad)}
.option:active:not(:disabled){transform:scale(.985)}
.opt-l{flex-shrink:0;width:28px;height:28px;border-radius:6px;background:var(--br);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--tm);transition:background .15s,color .15s}
.option.correct{border-color:var(--ok);background:var(--od)}
.option.correct .opt-l{background:var(--ok);color:#fff}
.option.wrong{border-color:var(--er);background:var(--ed)}
.option.wrong .opt-l{background:var(--er);color:#fff}
.option:disabled{cursor:default}
.btn-next{width:100%;padding:14px;background:var(--ac);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;margin-top:8px;display:none}
.btn-next:hover{opacity:.9}
.btn-next:active{transform:scale(.98)}
.btn-next.visible{display:block;animation:fu .2s ease both}
/* Results */
.results{text-align:center;animation:fu .4s ease both}
.ri{font-size:56px;margin-bottom:16px;line-height:1}
.results h2{font-size:28px;font-weight:700;margin-bottom:8px}
.score-big{font-size:48px;font-weight:800;color:var(--ac);margin:16px 0 4px;line-height:1}
.score-lbl{color:var(--tm);font-size:14px;margin-bottom:24px}
.rb-wrap{background:var(--br);border-radius:100px;height:8px;margin:0 auto 32px;max-width:300px;overflow:hidden}
.rb-fill{height:100%;border-radius:100px;background:var(--ac);transition:width 1s cubic-bezier(.4,0,.2,1)}
.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;text-align:left}
.bc{background:var(--cd);border:1px solid var(--br);border-radius:var(--rs);padding:16px}
.bc .v{font-size:24px;font-weight:700;margin-bottom:2px}
.bc .v.g{color:var(--ok)}.bc .v.r{color:var(--er)}
.bc .l{font-size:13px;color:var(--tm)}
.btn-restart{padding:14px 32px;background:var(--ac);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-restart:hover{opacity:.9}
@media(max-width:480px){.card{padding:20px}.breakdown{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="fsOverlay">
  <div style="font-size:52px;margin-bottom:16px">⛔</div>
  <h2>Celá obrazovka je povinná</h2>
  <p>Kvíz vyžaduje celú obrazovku. Klikni nižšie pre pokračovanie.</p>
  <button class="btn-primary" style="max-width:280px;margin:0 auto" onclick="enterFS()">Pokračovať v celej obrazovke</button>
</div>

<div id="tabBanner"></div>

<div class="wrap" id="appRoot">
  <div id="quizScreen">
    <header>
      <div class="chip">Matúš Maštena · III.IST</div>
      <h1>Cacheovanie a Monitoring DB</h1>
      <p>Interaktívny kvíz · 15 otázok</p>
    </header>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-meta">
        <span>Otázka <strong id="qNum">1</strong> z 15</span>
        <span id="scoreDisplay">Skóre: 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div id="quizArea"></div>
  </div>
</div>

<script>
var _Q = [
  {q:"Čo je cache hit?",o2:["Dáta sa načítajú z primárneho úloziska a uložia do cache","Požadovaná hodnota sa vráti okamžite bez prístupu na disk","Cache sa invaliduje a obnoví z databázy","Klient dostane chybovú odpoveď a skúsí znova"],c:1},
  {q:"Ktorá eviction policy je predvolená v Redis a Memcached?",o2:["FIFO (First In First Out)","LFU (Least Frequently Used)","LRU (Least Recently Used)","TTL (Time To Live)"],c:2},
  {q:"Ktorá vrstva cache je najbližšie k procesoru a má najnižšiu latenciu?",o2:["Aplikačná cache (Redis)","CDN (Cloudflare)","L1/L2/L3 CPU cache","Buffer Pool (InnoDB)"],c:2},
  {q:"Prečo bola Query Cache odstránená v MySQL 8.0?",o2:["Zaberala príliš veľký diskový priestor","Globálny mutex spôsoboval bottleneck pri vysokom paralelizme","Nefungovala správne s InnoDB tabuľkami","Bola nahraденá lepšou implementáciou Buffer Pool"],c:1},
  {q:"Na čo slúži nástroj sccache od Mozilla?",o2:["Monitorovanie pomalých SQL dotazov","Distribuovaná cache pre CDN obsah","Shared compilation cache pre Rust/C/C++/CUDA","Správa Redis Sentinel klastrov"],c:2},
  {q:"Aký je odporučaný cieľ pre Buffer Pool Hit Rate v produčcii?",o2:["Viac ako 75 %","Viac ako 90 %","Viac ako 95 %","Viac ako 99 %"],c:3},
  {q:"Čo je Cache Stampede?",o2:["Utočník vloži škodlivé dáta do cache","Cache obsahuje zastaré dáta po vypšaní TTL","Veľa požiadaviek naraz ide do DB pri expirácii kľúča","Pretŧaženie disku pri ukladaní veľkých objektov"],c:2},
  {q:"Čo v MySQL EXPLAIN znamená type: ALL?",o2:["Dotaz použil všetky dostupné indexy","Full table scan – najhorší prípad, typicky chýba index","Dotaz vrátil všetky stĺpce tabuľky","Výsledok bol cachovaný z predálšího behu"],c:1},
  {q:"Prečo sledujeme p99 latenciu namiesto iba priemeru?",o2:["P99 je jednoduchšia na výpočet ako priemer","Priemer skryje výkyvy, p99 odhalí nierovnosť pre 1 % prípadov","P99 je vždy nižšia ako priemer","Regulácie GDPR vyadujú monitorovanie p99"],c:1},
  {q:"Aká je kritická hranica replikačného lagu pri monitorovaní?",o2:["Viac ako 10 sekúnd","Viac ako 30 sekúnd","Viac ako 120 sekúnd (2 minúty)","Viac ako 300 sekúnd"],c:2},
  {q:"Čo je LFU eviction policy a aký má problém s novými kľúčmi?",o2:["Vyradí najstaršiu vloženú položku; nové kľúče majú starý timestamp","Vyradí položku s najmenším počтom prístupov; nové kľúče majú nízky počet","Vyradí najväčší objekt; nové malé kľúče zostávajú dlho","Vyradí náhodnú položku; nové kľúče sú zvýhodné"],c:1},
  {q:"Aký príkaz v MySQL zapne Slow Query Log s prahom 1 sekunda?",o2:["ENABLE slow_query_log WITH threshold=1;","SET GLOBAL slow_query_log = 1; SET GLOBAL long_query_time = 1;","ALTER SYSTEM SET slow_log_threshold = 1000;","log_min_duration_statement = 1000 v my.cnf"],c:1},
  {q:"Ktorý open-source monitoring stack kombinuje zber metrík a vizualizáciu?",o2:["Datadog + New Relic","pgAdmin + MySQL Workbench","Prometheus + Grafana","PMM + AWS RDS Performance Insights"],c:2},
  {q:"Čo je Write-through stratégia pri zápisoch do cache?",o2:["Aplikácia si sama riadi zápis do cache aj databázy","Zápis ide súčasne (synchrónne) do cache aj primárneho úloziska","Zápis do databázy prebehne asynchrónne neskôr","Stará cache položka sa vymaže, nová sa načíta pri prvom číaní"],c:1},
  {q:"Čo je Materialized View v kontexte databázovej cache?",o2:["Pohľad na dáta cez šifrovaný VPN tunel","Indexovaný pohľad, ktorý sa automaticky aktualizuje pri každom dotaze","Predpočítaný výsledok zložitého dotazu uložený ako fyzická tabuľka","Dočasná tabuľka vytvorená len pre jednu transakciu"],c:2}
];

// ── Runtime state ─────────────────────────────────────────────────
var _c=0,_s=0,_ans=false,_tabCnt=0,_maxTab=3,_startTs=0;
var _L=['A','B','C','D'];

function _shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
_shuf(_Q);

// ── Fullscreen ────────────────────────────────────────────────────
var _fsBlocked=false;

function enterFS(){
  var el=document.documentElement;
  var rfs=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(!rfs){_fsBlocked=true;return;}
  var p=rfs.call(el);
  if(p&&typeof p.catch==='function'){
    p.catch(function(){_fsBlocked=true;document.getElementById('fsOverlay').classList.remove('show');});
  }
}

document.addEventListener('fullscreenchange',_onFsChange);
document.addEventListener('webkitfullscreenchange',_onFsChange);
document.addEventListener('mozfullscreenchange',_onFsChange);

function _onFsChange(){
  if(_fsBlocked)return;
  var inFs=!!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement);
  var ov=document.getElementById('fsOverlay');
  if(!inFs){ov.classList.add('show');}else{ov.classList.remove('show');}
}

// ── Tab switch detection ──────────────────────────────────────────
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    _tabCnt++;
    var rem=_maxTab-_tabCnt;
    var b=document.getElementById('tabBanner');
    if(_tabCnt>=_maxTab){
      b.textContent='⚠️ Prepnutie karty '+_tabCnt+'x – Kvíz je ukončený pre porušenie pravidiel!';
      b.classList.add('show');
      _disableQuiz();
    } else {
      b.textContent='⚠️ Prepol si kartu! Varovanie '+_tabCnt+' z '+_maxTab+'. Po '+rem+' varovaní bude kvíz ukončený.';
      b.classList.add('show');
      setTimeout(function(){b.classList.remove('show');},4000);
    }
  }
});

function _disableQuiz(){
  var area=document.getElementById('quizArea');
  area.innerHTML='<div class="card" style="text-align:center"><div style="font-size:48px;margin-bottom:16px">⚠️</div><h2 style="margin-bottom:8px">Kvíz ukončený</h2><p style="color:var(--tm)">Prekročil si limit prepnutí kariet ('+_maxTab+'x). Kontaktuj učiteľa.</p></div>';
  document.getElementById('progressWrap').style.display='none';
}

// ── Quiz logic ────────────────────────────────────────────────────
function _renderQ(){
  var qa=_Q[_c];
  _ans=false;
  document.getElementById('qNum').textContent=_c+1;
  document.getElementById('progressFill').style.width=((_c/_Q.length)*100)+'%';

  var html='<div class="card"><div class="question-label">Otázka '+(_c+1)+' / '+_Q.length+'</div>';
  html+='<div class="question-text">'+qa.q+'</div><div class="options" id="opts">';
  for(var i=0;i<qa.o2.length;i++){
    html+='<button class="option" id="op'+i+'" onclick="_pick('+i+')"><span class="opt-l">'+_L[i]+'</span><span>'+qa.o2[i]+'</span></button>';
  }
  html+='</div></div>';
  html+='<button class="btn-next" id="btnN" onclick="_next()">'+((_c<_Q.length-1)?'Ďalšia otázka →':'Zobraziť výsledky')+'</button>';
  document.getElementById('quizArea').innerHTML=html;
}

function _pick(idx){
  if(_ans)return;
  _ans=true;
  var qa=_Q[_c];
  var ops=document.querySelectorAll('.option');
  ops.forEach(function(o){o.disabled=true;});
  ops[qa.c].classList.add('correct');
  if(idx!==qa.c){ops[idx].classList.add('wrong');}
  else{_s++;document.getElementById('scoreDisplay').textContent='Skóre: '+_s;}
  document.getElementById('btnN').classList.add('visible');
}

function _next(){
  _c++;
  if(_c>=_Q.length){_results();}else{_renderQ();}
}

function _results(){
  var dur=Math.floor(Date.now()/1000)-_startTs;
  fetch('/api/result',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:'',score:_s,total:_Q.length,pct:Math.round((_s/_Q.length)*100),duration:dur,tabSwitches:_tabCnt})
  }).catch(function(){});
  var pct=Math.round((_s/_Q.length)*100);
  var em=pct>=90?'🎉':pct>=70?'👍':pct>=50?'💪':'📚';
  var msg=pct>=90?'Vynikajúci výsledok!':pct>=70?'Veľmi dobrý výsledok!':pct>=50?'Dobrý základ, ešte je rezerva.':'Je čo zlepšovať – skús znova!';
  document.getElementById('progressWrap').style.display='none';
  document.getElementById('quizArea').innerHTML=
    '<div class="card results"><div class="ri">'+em+'</div><h2>'+msg+'</h2>'+
    '<div class="score-big">'+pct+'%</div>'+
    '<div class="score-lbl">'+_s+' správnych z '+_Q.length+' otázok</div>'+
    '<div class="rb-wrap"><div class="rb-fill" id="rBf" style="width:0%"></div></div>'+
    '<div class="breakdown">'+
    '<div class="bc"><div class="v g">'+_s+'</div><div class="l">Správnych odpovedí</div></div>'+
    '<div class="bc"><div class="v r">'+(_Q.length-_s)+'</div><div class="l">Nesprávnych odpovedí</div></div>'+
    '</div>'+
    '<button class="btn-restart" onclick="_restart()">Skúsiť znova</button></div>';
  var clr=pct>=70?'var(--ok)':pct>=50?'var(--ac)':'var(--er)';
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    var b=document.getElementById('rBf');
    b.style.width=pct+'%';b.style.background=clr;
  });});
}

function _restart(){
  _c=0;_s=0;_ans=false;_tabCnt=0;
  _shuf(_Q);
  document.getElementById('progressWrap').style.display='';
  document.getElementById('scoreDisplay').textContent='Skóre: 0';
  document.getElementById('tabBanner').classList.remove('show');
  _renderQ();
}

// ── Start ─────────────────────────────────────────────────────────
_startTs=Math.floor(Date.now()/1000);
enterFS();
_renderQ();
</script>
</body>
</html>
